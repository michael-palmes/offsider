version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  # Dependabot cannot load the root Package.swift (its binary targets come from scripts/build.sh), so it reads this copy.
  - package-ecosystem: swift
    directory: /.github/swiftpm-watch
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      swift:
        patterns:
          - "*"
