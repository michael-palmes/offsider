version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The gRPC and protobuf pins match checked-in generated code and change only by hand.
    ignore:
      - dependency-name: "github.com/grpc/grpc-swift-2"
      - dependency-name: "github.com/grpc/grpc-swift-nio-transport"
      - dependency-name: "github.com/grpc/grpc-swift-protobuf"
      - dependency-name: "github.com/apple/swift-protobuf"
    groups:
      swift:
        patterns:
          - "*"
