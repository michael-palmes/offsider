version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
# Swift packages are not watched: Package.swift declares binary targets under build_products/,
# which scripts/build.sh produces, so Dependabot cannot load the manifest.
