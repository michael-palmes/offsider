name: Probe (temporary)

# Temporary, for #121's parallel stall: shows whether Vision text reads deadlock Swift's thread pool on this runner. Removed before merge.
on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vision-pool:
    name: Vision reads and the thread pool (temporary)
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Text reads at once, held on the pool and off it
        env:
          DEVELOPER_DIR: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}/Contents/Developer
        run: |
          set -uo pipefail
          echo "cpus: $(sysctl -n hw.ncpu) logical, $(sysctl -n hw.activecpu) active"
          xcrun swiftc -swift-version 5 -parse-as-library -O -o "$RUNNER_TEMP/vision-pool" .github/probe/vision-pool.swift
          cpus="$(sysctl -n hw.activecpu)"
          probe() {
            "$RUNNER_TEMP/vision-pool" "$@" &
            local pid=$! sample="$RUNNER_TEMP/sample-$1-$2.txt"
            for _ in $(seq 20); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              sample "$pid" 1 -file "$sample" >/dev/null 2>&1 || sudo sample "$pid" 1 -file "$sample" >/dev/null 2>&1 || true
              if [[ -s "$sample" ]]; then
                echo "  threads in the read on a user-initiated pool thread: $(grep -c 'user-initiated-qos.cooperative' "$sample")"
                echo "  threads waiting on a semaphore: $(grep -c 'semaphore_wait_trap  (in libsystem_kernel' "$sample")"
                grep -m1 -A3 'TextRecognition' "$sample" | cut -c1-160
              fi
            fi
            wait "$pid"
          }
          probe width 24
          probe detached 1
          probe detached 3
          probe detached "$cpus"
          probe queue "$((cpus * 2))"
          probe queue 3
