name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sign, notarise and verify only (no attestation, release or tap update). false is only honoured when dispatched on a v* tag. Dispatched from a branch, the run rehearses with an ad-hoc signature and never sees the signing secrets."
        type: boolean
        default: true
      version:
        description: "Version to embed when not dispatched on a tag (e.g. 0.1.0-rc.1)"
        type: string
        default: "0.0.0-dryrun"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  TAP_REPO: michael-palmes/homebrew-tap

jobs:
  # Builds from pinned source with no secrets in reach. Its only output is an unsigned payload and its digest.
  build:
    name: Build unsigned payload
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      archive: ${{ steps.meta.outputs.archive }}
      payload: ${{ steps.meta.outputs.payload }}
      payload_sha256: ${{ steps.payload.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tag verification and ancestry check need full history
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; version="${tag#v}"; else version="$INPUT_VERSION"; fi
          re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $re ]] || { echo "::error::invalid version '$version'"; exit 1; }
          publish=false
          if [ -n "$tag" ] && { [ "$EVENT_NAME" = push ] || [ "$INPUT_DRY_RUN" = false ]; }; then publish=true; fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"; echo "tag=$tag"; echo "publish=$publish"
            echo "prerelease=$prerelease"; echo "archive=offsider-${version}-arm64.tar.gz"
            echo "payload=offsider-${version}-arm64-unsigned.tar.gz"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Offsider $version (tag: ${tag:-none}, publish: $publish, prerelease: $prerelease)"

      # Pins the signer to the key in main's .github/allowed_signers (read from main, never from
      # the tagged tree, so a tag cannot vouch for itself), and requires the tag to be on main.
      - name: Verify tag signature and ancestry
        if: steps.meta.outputs.tag != ''
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ] || { echo "::error::${TAG} is not an annotated tag (use git tag -s)"; exit 1; }
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" -c gpg.minTrustLevel=fully verify-tag --verbose "$TAG"
          commit="$(git rev-parse "${TAG}^{commit}")"
          [ "$(git rev-parse HEAD)" = "$commit" ] || { echo "::error::checkout is not the tagged commit"; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::${TAG} is not on main"; exit 1; }

      - name: Select Xcode
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ] || { echo "::error::expected an arm64 runner"; exit 1; }
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP not found"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          sw_vers; xcodebuild -version

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSLo "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          bin_dir="$(dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)")"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/xcodegen" --version

      - name: Runner project (regenerate and compare)
        run: scripts/build.sh runner --check

      # Deliberately uncached: the signed artifact is built from pinned source on a clean runner.
      - name: Build idb frameworks from pinned source
        run: |
          set -euo pipefail
          for step in setup clean frameworks install strip xcframeworks verify-xcframeworks; do
            scripts/build.sh "$step"
          done

      - name: Build Offsider (release, arm64)
        env:
          OFFSIDER_VERSION: ${{ steps.meta.outputs.version }}
          SWIFT_DETERMINISTIC_HASHING: "1"
        run: scripts/build.sh executable

      - name: Stage and pack the unsigned payload
        run: |
          set -euo pipefail
          scripts/release.sh stage --version "$VERSION"
          scripts/release.sh pack-payload --version "$VERSION"

      - name: Record payload digest
        id: payload
        run: echo "sha256=$(cut -d' ' -f1 dist/PAYLOAD.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offsider-${{ steps.meta.outputs.version }}-unsigned
          path: dist/${{ steps.meta.outputs.payload }}
          if-no-files-found: error
          retention-days: 1

  helper:
    name: Android helper (rebuild and compare)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HELPER_BUILD_TOOLS: "37.0.0"
      HELPER_PLATFORM: "android-37.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "17.0.20"

      - name: Install the pinned build-tools and platform
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "build-tools;${HELPER_BUILD_TOOLS}" "platforms;${HELPER_PLATFORM}" > /dev/null

      - name: Rebuild the helper dex and compare it with the committed one
        run: OFFSIDER_HELPER_JDK="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" scripts/build.sh helper --check

  # The only job that can see the signing and notary secrets. It builds nothing and never runs the payload:
  # it checks the payload's digest against the build job, signs, notarises and packages.
  sign:
    name: Sign and notarise
    needs: [build, helper]
    if: needs.build.outputs.tag != ''
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      PAYLOAD: ${{ needs.build.outputs.payload }}
      PAYLOAD_SHA256: ${{ needs.build.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the checkout is the tagged commit
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")" ] || { echo "::error::checkout is not the tagged commit"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}-unsigned
          path: dist

      - name: Verify the payload digest and unpack it
        run: scripts/release.sh unpack-payload --version "$VERSION" --sha256 "$PAYLOAD_SHA256"

      - name: Select Xcode
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ] || { echo "::error::expected an arm64 runner"; exit 1; }
          [ -d "$XCODE_APP" ] || { echo "::error::$XCODE_APP not found"; exit 1; }
          sudo xcode-select --switch "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcrun notarytool --version

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "${APPLE_TEAM_ID:-}" ] || { echo "::error::APPLE_TEAM_ID is not set in the release environment"; exit 1; }
          SIGNING_IDENTITY_NAME="Developer ID Application: Michael Palmes (${APPLE_TEAM_ID})"
          kc="$RUNNER_TEMP/offsider-signing.keychain-db"
          kc_pw="$(openssl rand -base64 32)"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          existing="$(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc" $existing
          identity="$(security find-identity -v -p codesigning "$kc" | grep -F "\"${SIGNING_IDENTITY_NAME}\"" | awk '{ print $2 }' | head -1)"
          [ -n "$identity" ] || { echo "::error::'${SIGNING_IDENTITY_NAME}' not found in the imported p12"; exit 1; }
          { echo "SIGNING_KEYCHAIN=$kc"; echo "OFFSIDER_SIGNING_IDENTITY=$identity"; echo "TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"

      - name: Sign (inside-out, hardened runtime, secure timestamp)
        run: scripts/release.sh sign --version "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi

      - name: Write notary API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          case "$NOTARY_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$NOTARY_KEY_P8" > "$key" ;;
            *) printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key" ;;
          esac
          echo "OFFSIDER_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Notarise
        env:
          OFFSIDER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          OFFSIDER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release.sh notarize --version "$VERSION"

      - name: Remove the notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Package tarball and SHA256SUMS
        run: scripts/release.sh package --version "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}-signed
          path: |
            dist/${{ needs.build.outputs.archive }}
            dist/SHA256SUMS
            dist/notary-submit.json
            dist/notary-log.json
            dist/notarised-cdhashes.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"

  # Runs the signed payload (smoke tests, Homebrew install) on a runner that never held a secret.
  verify:
    name: Verify and Homebrew gate
    needs: [build, sign]
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      VERSION: ${{ needs.build.outputs.version }}
      ARCHIVE: ${{ needs.build.outputs.archive }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          [ -d "$XCODE_APP" ] || { echo "::error::$XCODE_APP not found"; exit 1; }
          sudo xcode-select --switch "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}-signed
          path: dist

      - name: Verify shipped tarball
        run: |
          set -euo pipefail
          [ -n "${TEAM_ID:-}" ] || { echo "::error::APPLE_TEAM_ID is not set as a repository variable"; exit 1; }
          scripts/release.sh unpack-archive --version "$VERSION"
          scripts/release.sh verify --version "$VERSION" --check-notarization

      # Pre-publish gate: install the exact tarball through a local tap with the same formula
      # template, then prove Homebrew left every byte and the Developer ID signatures intact.
      - name: Homebrew gate
        run: scripts/release.sh brew-gate --version "$VERSION"

      - name: Render Homebrew formula
        run: scripts/release.sh render-formula --version "$VERSION" > dist/offsider.rb

      - name: Record checksum
        id: checksum
        run: echo "sha256=$(cut -d' ' -f1 dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Offsider ${VERSION}"
            echo '```'; cat dist/SHA256SUMS; echo '```'
            echo "Notary submission: $(jq -r .id dist/notary-submit.json)"
            echo '```'; codesign -dv --verbose=4 "dist/offsider-${VERSION}-arm64/offsider" 2>&1; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}
          path: |
            dist/${{ needs.build.outputs.archive }}
            dist/SHA256SUMS
            dist/offsider.rb
            dist/notary-submit.json
            dist/notary-log.json
            dist/notarised-cdhashes.txt
          if-no-files-found: error
          retention-days: 30

  # A dispatch from a branch: the same pipeline with an ad-hoc signature, no environment and no secrets.
  rehearse:
    name: Ad-hoc rehearsal
    needs: build
    if: needs.build.outputs.tag == ''
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      VERSION: ${{ needs.build.outputs.version }}
      PAYLOAD: ${{ needs.build.outputs.payload }}
      PAYLOAD_SHA256: ${{ needs.build.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          [ -d "$XCODE_APP" ] || { echo "::error::$XCODE_APP not found"; exit 1; }
          sudo xcode-select --switch "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}-unsigned
          path: dist

      - name: Sign ad hoc, package, verify and gate
        run: |
          set -euo pipefail
          scripts/release.sh unpack-payload --version "$VERSION" --sha256 "$PAYLOAD_SHA256"
          scripts/release.sh sign --version "$VERSION" --adhoc
          scripts/release.sh package --version "$VERSION"
          scripts/release.sh verify --version "$VERSION" --adhoc
          scripts/release.sh brew-gate --version "$VERSION" --adhoc

  publish:
    name: Attest and publish GitHub release
    needs: [build, verify]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      ARCHIVE: ${{ needs.build.outputs.archive }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}
          path: dist

      - name: Check artifact integrity against the verify job output
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          [ "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$SHA256" ]

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ needs.build.outputs.archive }}
            dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Install

              brew install michael-palmes/tap/offsider

          ## Verify

              shasum -a 256 -c SHA256SUMS
              gh attestation verify ${ARCHIVE} --repo ${GITHUB_REPOSITORY} \\
                --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml --source-ref refs/tags/${TAG}

          Signed with a Developer ID Application certificate, hardened runtime, notarised by Apple.
          EOF
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Offsider ${VERSION}" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          # Draft first, then publish, so immutable releases lock a complete asset set.
          gh release create "$TAG" "${flags[@]}" "dist/${ARCHIVE}" dist/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Opens a pull request on the tap with a GitHub App token; the tap's own ruleset and CI
  # (attestation, Team ID and byte checks) gate the merge, and auto-merge lands it.
  tap:
    name: Update Homebrew tap
    needs: [build, verify, publish]
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment: homebrew-tap # holds the tap App's private key; v* tags only
    timeout-minutes: 10
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offsider-${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: michael-palmes
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Open the formula pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          grep -Fq "sha256 \"${SHA256}\"" dist/offsider.rb
          path=Formula/offsider.rb
          branch="offsider-${VERSION}"
          base="$(gh api "repos/${TAP_REPO}/git/ref/heads/main" --jq .object.sha)"
          gh api --method POST "repos/${TAP_REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="$base" --jq .ref
          current="$(gh api "repos/${TAP_REPO}/contents/${path}?ref=${branch}" --jq .sha 2>/dev/null || true)"
          if [ "$current" = null ]; then current=""; fi
          args=(--method PUT "repos/${TAP_REPO}/contents/${path}"
            -f message="offsider ${VERSION}"
            -f branch="$branch"
            -f content="$(base64 -w0 dist/offsider.rb)")
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" --jq '.commit.sha'
          url="$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" --title "offsider ${VERSION}" \
            --body "Release ${RELEASE_URL}, tarball sha256 ${SHA256}. Opened by the release workflow; the tap's CI checks the attestation, Team ID and bytes before auto-merge.")"
          gh pr merge --repo "$TAP_REPO" --auto --squash "$url"
          echo "Tap pull request: $url" >> "$GITHUB_STEP_SUMMARY"
