name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Stable symlink present before and after the RC to GA path rename on the xcode-27 image.
  XCODE_APP: ${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  lint:
    name: Lint (shell, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bash -n
        run: |
          set -euo pipefail
          for f in scripts/*.sh test-runner.sh; do bash -n "$f"; done

      - name: CI script tests
        run: |
          set -euo pipefail
          bash scripts/ci-changes.test.sh
          bash scripts/ci-gate.test.sh

      - name: Every CI job gates merges
        run: scripts/ci-gate.sh --check-needs .github/workflows/ci.yml ci-passed asan-unit-tests asan-issue

      # Full strictness on the release script; upstream scripts gated at error level until cleaned up.
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck scripts/release.sh
          shellcheck --severity=error scripts/*.sh test-runner.sh

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  leak-gate:
    name: Leak gate (private strings)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Forks and Dependabot get no secret, so only the generic patterns run there.
      - name: Write the private deny-list
        env:
          DENYLIST_CONTENT: ${{ secrets.OFFSIDER_PRIVATE_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "$DENYLIST_CONTENT" ]; then
            echo "::notice title=Leak gate::No private deny-list secret here (fork or Dependabot), so only the generic patterns run"
            exit 0
          fi
          list="$RUNNER_TEMP/private-denylist.txt"
          (umask 077 && printf '%s\n' "$DENYLIST_CONTENT" > "$list")
          echo "OFFSIDER_PRIVATE_DENYLIST=$list" >> "$GITHUB_ENV"

      - name: Scan the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/leak-gate.sh --range "$PR_BASE..$PR_HEAD"
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            scripts/leak-gate.sh --range "$PUSH_BEFORE..$GITHUB_SHA"
          else
            echo "::notice title=Leak gate::No earlier commit to compare with, so only the head commit is scanned"
            scripts/leak-gate.sh --range "$GITHUB_SHA~1..$GITHUB_SHA"
          fi

  helper:
    name: Android helper (rebuild and compare)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HELPER_BUILD_TOOLS: "37.0.0"
      HELPER_PLATFORM: "android-37.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "17.0.20"

      - name: Install the pinned build-tools and platform
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install "build-tools;${HELPER_BUILD_TOOLS}" "platforms;${HELPER_PLATFORM}" > /dev/null

      - name: Rebuild the helper dex and compare it with the committed one
        run: OFFSIDER_HELPER_JDK="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" scripts/build.sh helper --check

  rn-typecheck:
    name: React Native playground typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The repository allows GitHub-owned actions only, so pnpm comes from npm rather than pnpm/action-setup.
      - name: Install pnpm
        run: npm install -g pnpm@11.20.0

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm --dir OffsiderPlaygroundRN install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm --dir OffsiderPlaygroundRN typecheck

  # A docs-only pull request skips both macOS jobs; off pull requests ASan stands in for the unit tests, and runs alone weekly.
  changes:
    name: Changes (docs only?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit-tests: ${{ steps.classify.outputs.unit-tests }}
      release-rehearsal: ${{ steps.classify.outputs.release-rehearsal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # A pull request checks out its merge commit, so HEAD^1 is the base it lands on.
      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              macos="$(git diff --name-only --no-renames HEAD^1 HEAD | scripts/ci-changes.sh)"
              unit="${macos#macos=}" rehearsal="${macos#macos=}"
              if [ "$macos" = macos=false ]; then
                echo "::notice title=Docs only::Only docs changed, so the macOS build, tests and release rehearsal are skipped"
              fi
              ;;
            schedule)
              unit=false rehearsal=false
              echo "::notice title=Weekly::The weekly run is the AddressSanitizer unit tests alone"
              ;;
            *)
              unit=false rehearsal=true
              echo "::notice title=AddressSanitizer::The AddressSanitizer job runs the unit tests here, so the plain run is skipped"
              ;;
          esac
          printf 'unit-tests=%s\nrelease-rehearsal=%s\n' "$unit" "$rehearsal" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit-tests == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-setup
        with:
          xcode-app: ${{ env.XCODE_APP }}

      - name: Unit tests
        run: OFFSIDER_REUSE_IDB=1 ./test-runner.sh --unit-tests

  release-rehearsal:
    name: Release build and rehearsal (ad-hoc)
    needs: changes
    if: needs.changes.outputs.release-rehearsal == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-setup
        with:
          xcode-app: ${{ env.XCODE_APP }}

      - name: Runner project (regenerate and compare)
        run: scripts/build.sh runner --check

      - name: Release build (arm64)
        env:
          OFFSIDER_VERSION: "0.0.0-ci"
          SWIFT_DETERMINISTIC_HASHING: "1"
        run: scripts/build.sh executable

      # Runs the real release script with an ad-hoc identity: stage, sign, package, verify,
      # and a Homebrew install that byte-compares the keg against the payload. No secrets.
      - name: Release pipeline rehearsal (ad-hoc)
        run: scripts/release.sh rehearse --version 0.0.0-ci --adhoc

  # The one required check from this workflow. It runs after a cancel too, so a cancelled run never counts as passed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, leak-gate, helper, rn-typecheck, unit-tests, release-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every job passed, or was skipped where the changes job allows it
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh --skippable unit-tests --skippable release-rehearsal

  # Not gated by CI passed. SwiftPM's --sanitize=address (not -Xswiftc) also injects the runtime into its test helpers.
  asan-unit-tests:
    name: Unit tests (AddressSanitizer)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    outputs:
      build: ${{ steps.build.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-setup
        with:
          xcode-app: ${{ env.XCODE_APP }}

      - name: Build with AddressSanitizer
        id: build
        run: swift build --build-tests --sanitize=address

      - name: Unit tests with AddressSanitizer
        id: tests
        env:
          OFFSIDER_E2E: "0"
          OFFSIDER_LANDSCAPE_E2E: "0"
          # Keeps the runtime in DYLD_INSERT_LIBRARIES, so an exit test's child starts with it.
          ASAN_OPTIONS: strip_env=0
        run: swift test --skip-build --sanitize=address --no-parallel

  # No pull request watches main, so a failed ASan build or test step there (a timeout included) opens one issue, or adds to it.
  asan-issue:
    name: Report an AddressSanitizer failure on main
    needs: asan-unit-tests
    if: >-
      failure() && github.ref == 'refs/heads/main'
      && (needs.asan-unit-tests.outputs.build == 'failure'
      || contains(fromJSON('["failure", "cancelled"]'), needs.asan-unit-tests.outputs.tests))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="AddressSanitizer unit tests fail on main"
          failed="The AddressSanitizer unit tests failed on ${SHA}: ${RUN_URL}"
          howto="Reproduce with \`ASAN_OPTIONS=strip_env=0 swift test --sanitize=address --no-parallel\`, and close this issue once main passes again."
          # Only this workflow's own issue counts, never one someone else opened with the same title.
          number="$(gh issue list --state open --search "author:app/github-actions in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$failed"
          else
            gh issue create --title "$title" --body "$(printf '%s\n\n%s\n' "$failed" "$howto")"
          fi
