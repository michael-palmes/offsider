name: OffsiderRunner
options:
  bundleIdPrefix: com.mpalmes.offsider
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  OffsiderRunnerHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpalmes.offsider.runner
        PRODUCT_NAME: OffsiderRunnerHost
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Offsider Runner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  OffsiderRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: OffsiderRunnerHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpalmes.offsider.runner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OffsiderRunnerHost
schemes:
  OffsiderRunner:
    shared: true
    build:
      targets:
        OffsiderRunnerHost: all
        OffsiderRunnerUITests: [test]
    test:
      config: Debug
      targets:
        - OffsiderRunnerUITests
